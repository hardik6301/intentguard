name: eval

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Pytest
        run: PYTHONPATH=. python -m pytest tests evaluation/test_harness.py
      - name: Unsafe Approval Rate
        run: PYTHONPATH=. python -m evaluation.runner
